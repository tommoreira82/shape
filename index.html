function miniGraph(points,color="#a58cff",h=105){if(!points.length)return `<p class="note">Ajoute quelques pesées pour voir ta progression.</p>`;let a=points.slice(-30),mn=Math.min(...a.map(p=>p.value)),mx=Math.max(...a.map(p=>p.value));let range=Math.max(1,mx-mn);let arr=a.map((p,i)=>[(i/(Math.max(1,a.length-1))*300).toFixed(1),(h-14-(p.value-mn)/range*(h-28)).toFixed(1)]);return `<svg role="img" aria-label="Courbe de poids" viewBox="0 0 300 ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="M${arr.map(p=>p.join(",")).join(" L")}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${arr.at(-1)[0]}" cy="${arr.at(-1)[1]}" r="4" fill="${color}"/></svg>`}

function coach(){let dates=Object.keys(state.days).sort(),cur=[],prev=[];for(let i=0;i<7;i++){let k=shift(selected,-i),p=state.days[k];if(p&&p.weight>0)cur.push(+p.weight);let j=state.days[shift(selected,-i-7)];if(j&&j.weight>0)prev.push(+j.weight)}if(cur.length<4||prev.length<4)return "Enregistre ton poids régulièrement. Après deux semaines suffisamment renseignées, je pourrai comparer tes moyennes de poids.";let now=cur.reduce((a,b)=>a+b,0)/cur.length,before=prev.reduce((a,b)=>a+b,0)/prev.length,loss=before-now,complete=0;for(let i=0;i<14;i++)if(state.days[shift(selected,-i)]?.complete)complete++;if(loss>now*.01)return `Ta moyenne de poids baisse rapidement (${dec(loss)} kg en une semaine). Surveille ta récupération et ta force.`;if(loss<.1)return `La moyenne du poids est presque stable (${dec(loss)} kg). ${complete<10?"Il manque des journées alimentaires validées pour juger tes apports.":"Si cette tendance continue, nous pourrons envisager un petit ajustement."}`;return `Ta moyenne de poids a baissé d'environ ${dec(loss)} kg par rapport à la semaine précédente. Si tes performances restent stables, conserve ton rythme.`}

function recipeResults(){return ui.recipeSearch?findFoods(ui.recipeSearch,7).map(f=>`<div class="searchitem"><div><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal /100 g</small></div><button class="tap" data-action="ingredient" data-id="${esc(f.id)}">＋</button></div>`).join(""):""}
function activity(){let d=dday();return `${shapeHeader("Activité","Musculation et récupération")}<div class="row wrap"><button class="btn green" data-action="new-session">＋ Nouvelle séance</button><button class="btn secondary" data-action="go" data-to="recovery">Récupération</button></div><div class="card"><h3>Énergie & activité</h3><div class="grid2"><div class="field"><label>Calories actives estimées (kcal)</label><input id="burned-input" type="number" min="0" value="${d.burned??""}"></div><div class="field"><label>Cardio (minutes)</label><input id="cardio-input" type="number" min="0" value="${d.cardio??""}"></div></div><button class="btn secondary full" data-action="save-activity">Enregistrer l'activité</button><p class="note">Ces calories restent une estimation externe ou manuelle. Aucun ajout automatique aux calories à consommer.</p></div><div class="section"><h2>Mes séances</h2>${d.workouts?.length?d.workouts.map(w=>`<div class="card"><div class="between"><div><b>${esc(w.name)}</b><small style="display:block">${w.exercises.length} exercices · Ressenti : ${esc(w.rating||"—")}</small></div><button class="linkbtn pink" data-action="delete-workout" data-id="${esc(w.id)}">Supprimer</button></div>${w.exercises.map(e=>`<small style="display:block;margin-top:9px">${esc(e.name)} : ${e.sets.map(s=>fmt(s.kg)+" kg × "+fmt(s.reps)).join(" · ")}</small>`).join("")}</div>`).join(""):`<div class="card note">Aucune séance enregistrée pour cette journée.</div>`}</div>`}
function sessionEditor(){let w=ui.session;return `${shapeHeader("Nouvelle séance","Note seulement les séries utiles")}<div class="card"><div class="field"><label>Nom de la séance</label><input id="session-name" value="${esc(w.name)}" placeholder="Haut du corps"></div><div class="field"><label>Ressenti général</label><select id="session-rating">${["Bonne","Stable","En baisse","Excellente"].map(x=>`<option ${w.rating===x?"selected":""}>${x}</option>`).join("")}</select></div></div>${w.exercises.map((e,i)=>`<div class="card"><div class="between"><h3>${esc(e.name)}</h3><button class="linkbtn pink" data-action="remove-exercise" data-index="${i}">Retirer</button></div><div class="field"><label>Exercice</label><input data-exercise-name="${i}" value="${esc(e.name)}"></div>${e.sets.map((s,j)=>`<div class="grid2" style="margin-bottom:7px"><div><label>Poids (kg)</label><input type="number" min="0" step=".5" data-set-kg="${i}:${j}" value="${s.kg}"></div><div><label>Répétitions</label><input type="number" min="1" data-set-reps="${i}:${j}" value="${s.reps}"></div></div>`).join("")}<button class="btn small secondary" data-action="add-set" data-index="${i}">＋ Série</button><button class="linkbtn pink" data-action="remove-set" data-index="${i}">− Série</button></div>`).join("")}<div class="card"><div class="row"><button class="btn secondary" data-action="add-exercise">＋ Exercice</button><button class="btn green" data-action="save-session">Terminer la séance</button></div></div>`}
function recovery(){let d=dday();return `${shapeHeader("Récupération",smallDate(selected))}<div class="card"><div class="field"><label>Durée du sommeil (heures)</label><input id="sleep-input" type="number" min="0" max="24" step=".25" value="${d.sleep??""}"></div><div class="field"><label>Fatigue ressentie</label><select id="fatigue-input">${[1,2,3,4,5].map(i=>`<option value="${i}" ${d.fatigue==i?"selected":""}>${i} / 5</option>`).join("")}</select></div><div class="field"><label>Courbatures</label><select id="soreness-input">${[1,2,3,4,5].map(i=>`<option value="${i}" ${d.soreness==i?"selected":""}>${i} / 5</option>`).join("")}</select></div><button class="btn full" data-action="save-recovery">Enregistrer</button></div><p class="note">Les indicateurs de récupération sont des ressentis, pas des diagnostics médicaux.</p>`}
function progressScreen(){let d=dday(),p=trendValues(),last=p.slice(-7),avg=last.length?last.reduce((a,b)=>a+b.value,0)/last.length:null;return `${shapeHeader("Évolution","Les tendances comptent plus qu'un jour") }<div class="card"><div class="between"><div><small>Poids actuel</small><div class="big">${listWeight()}</div></div><button class="btn" data-action="weight">＋ Pesée</button></div><div class="divider"></div>${miniGraph(p,"#a58cff",155)}<div class="grid2"><div class="stat"><small>Moyenne 7 dernières pesées</small><strong>${avg?dec(avg).toLocaleString("fr-FR")+" kg":"—"}</strong></div><div class="stat"><small>Nombre de pesées</small><strong>${p.length}</strong></div></div></div><div class="card"><h3>Tour de taille</h3><div class="between"><b>${d.waist?d.waist+" cm":"Non renseigné"}</b><button class="btn small secondary" data-action="waist">＋ Mesure</button></div></div><div class="card"><h3>Analyse de Shape</h3><p>${esc(coach())}</p></div><div class="card"><h3>Historique du poids</h3>${p.slice(-14).reverse().map(x=>`<div class="entry"><b>${esc(x.date)}</b><span>${x.value.toLocaleString("fr-FR")} kg</span></div>`).join("")||'<p class="note">Aucune mesure.</p>'}</div>`}
function settings(){return `${shapeHeader("Plus","Personnalise ton expérience")}<div class="card">${[["🎯","Mes objectifs","goals"],["🍲","Mes recettes","recipes"],["🌙","Récupération","recovery"],["📈","Mon évolution","progress"]].map(([icon,text,page])=>`<div class="entry"><b>${icon} ${text}</b><button class="linkbtn" data-action="go" data-to="${page}">Ouvrir →</button></div>`).join("")}</div><div class="card"><h3>Sauvegarde des données</h3><div class="row wrap"><button class="btn small secondary" data-action="export">Exporter JSON</button><button class="btn small secondary" data-action="import">Importer JSON</button></div><input id="import-file" type="file" accept=".json,application/json" hidden><p class="note">Tes données sont sur ce téléphone, sans synchronisation cloud. Conserve une sauvegarde dans Fichiers ou iCloud Drive.</p></div><div class="card"><h3>Apple Santé</h3><p class="note">Cette version web ne lit pas directement Santé. Un raccourci iPhone peut copier le total de pas du jour, puis tu touches « Importer Santé » dans Shape.</p><button class="btn secondary" data-action="import-steps">Importer les pas</button></div><div class="card"><h3>Sources nutritionnelles</h3><p class="note">Base indicative locale et produits Open Food Facts (ODbL). Les valeurs varient selon les marques et cuissons. Les recettes et données restent personnelles.</p><button class="btn small secondary" data-action="new-custom">＋ Aliment personnalisé</button></div>`}
function goals(){let g=state.goals;return `${shapeHeader("Mes objectifs","Tous modifiables") }<div class="card"><div class="grid2">${[["kcal","Calories / jour","kcal"],["protein","Protéines (g)","g"],["carbs","Glucides (g)","g"],["fat","Lipides (g)","g"],["steps","Pas quotidiens","pas"],["water","Eau (ml)","ml"],["sleep","Sommeil (h)","h"],["burned","Calories actives indicatives","kcal"],["loss","Perte visée (kg/semaine)","kg"]].map(([key,label,unit])=>`<div class="field"><label>${label}</label><input type="number" min="0" step="${key==='loss'?'0.05':key==='sleep'?'0.25':'1'}" data-goal="${key}" value="${g[key]}"></div>`).join("")}</div><button class="btn full" data-action="save-goals">Enregistrer les objectifs</button></div>`}
function navbar(){let current={home:"home",meals:"meals",add:"meals",recipes:"meals",recipe:"meals",recipeEdit:"meals",activity:"activity",session:"activity",recovery:"activity",progress:"progress",settings:"settings",goals:"settings"}[view];$("#nav").innerHTML=`<div>${[["home","⌂","Accueil"],["meals","♜","Repas"],["activity","⚡","Activité"],["progress","▥","Évolution"],["settings","⋯","Plus"]].map(([page,icon,name])=>`<button class="${page===current?"on":""}" data-action="go" data-to="${page}"><span>${icon}</span>${name}</button>`).join("")}</div>`}
function render(){let renderers={home,meals,add:addScreen,recipes,recipe:recipeScreen,recipeEdit:recipeEditor,activity,session:sessionEditor,recovery,progress:progressScreen,settings,goals};$("#app").innerHTML=(renderers[view]||home)();navbar()}
function go(page){view=page;ui.online=[];render();scrollTo({top:0,behavior:"smooth"})}
function toast(message){let n=document.createElement("div");n.textContent=message;n.style.cssText="position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#2e3c52;color:white;padding:12px 16px;border-radius:12px;z-index:30;max-width:90%";document.body.append(n);setTimeout(()=>n.remove(),2300)}
function sheet(title,body,kind){$("#modal").innerHTML=`<div class="overlay"><div class="sheet"><div class="between"><h2>${esc(title)}</h2><button class="tap" data-action="close-modal">✕</button></div><form id="modal-form" data-kind="${kind}">${body}<button class="btn full" type="submit">Enregistrer</button></form></div></div>`}
function weightSheet(kind="weight"){let d=dday(),past=trendValues().at(-1)?.value||70;sheet(kind==="weight"?"Pesée du matin":"Tour de taille",`<div class="field"><label>${kind==="weight"?"Poids (kg)":"Tour de taille (cm)"}</label><input id="modal-number" type="number" required autofocus min="${kind==="weight"?20:30}" max="${kind==="weight"?300:250}" step=".1" value="${kind==="weight"?(d.weight||past):(d.waist||"")}"></div>`,kind)}
function parseText(){let chunks=$("#phrase").value.replace(/(\d),(?=\d)/g,"$1.").split(/\s*(?:\+|;|\n|,)\s*/).map(x=>x.trim()).filter(Boolean);ui.pending=chunks.map(input=>{let m=input.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l)?\s+(.*)$/i);if(!m)return {input,qty:0,matches:[],choice:null};let qty=Number(m[1].replace(",","."))*(m[2]?.toLowerCase()==="kg"||m[2]?.toLowerCase()==="l"?1000:1);let matches=matchPhrase(m[3]);return {input,qty,matches,choice:matches[0]?.id||null}});$("#app").innerHTML=addScreen();navbar()}
function commitPhrase(){if(ui.pending.some(p=>!p.choice||p.qty<=0)){toast("Vérifie les aliments non reconnus");return}let meal=$("#phrase-meal").value;for(let p of ui.pending){let f=getFood(p.choice);if(!f)return;dday().foods.push(entry(f,p.qty,meal));state.recent[f.id]=p.qty}ui.pending=[];persist();go("meals");toast("Repas ajouté")}
function createRecipe(existing=null){ui.recipeDraft=existing?structuredClone(existing):{id:null,name:"",ingredients:[],finalGrams:0,servings:4};ui.recipeSearch="";go("recipeEdit")}
function makeSession(){ui.session={name:"Haut du corps",rating:"Stable",exercises:[{name:"Développé couché",sets:[{kg:80,reps:8}]}]};go("session")}
function sendBackup(){let a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.href=url;a.download="shape-sauvegarde-"+dayKey()+".json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function offSearch(query,barcode=false){let url;if(barcode)url="https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(query)+".json?fields=code,product_name,product_name_fr,brands,nutriments";else url="https://world.openfoodfacts.org/cgi/search.pl?"+new URLSearchParams({search_terms:query,search_simple:"1",action:"process",json:"1",page_size:"15",fields:"code,product_name,product_name_fr,brands,nutriments"});let r=await fetch(url);if(!r.ok)throw Error("Serveur indisponible");let j=await r.json(),products=barcode?(j.status===1?[j.product]:[]):(j.products||[]);let items=products.map(p=>{let n=p?.nutriments||{},k=n["energy-kcal_100g"]!=null?+n["energy-kcal_100g"]:(n["energy_100g"]!=null?+n["energy_100g"]/4.184:NaN),protein=+n.proteins_100g,carbs=+n.carbohydrates_100g,fat=+n.fat_100g;if([k,protein,carbs,fat].some(x=>!Number.isFinite(x)||x<0)||n.proteins_100g==null||n.carbohydrates_100g==null||n.fat_100g==null)return null;return {id:"off"+(p.code||id()),name:p.product_name_fr||p.product_name||"Produit",brand:p.brands||"",source:"Open Food Facts",category:"Marque",aliases:[],kcal:dec(k),protein:dec(protein),carbs:dec(carbs),fat:dec(fat)}}).filter(Boolean);return items}
async function importSteps(){let text="";try{if(navigator.clipboard?.readText)text=await navigator.clipboard.readText()}catch(e){}if(!text)text=prompt("Colle le total de pas depuis Santé (ex : 8240 ou PAS|2026-10-24|8240) :")||"";let m=text.trim().match(/^PAS\|(\d{4}-\d{2}-\d{2})\|(\d{1,7})$/i);let number,date;if(m){date=m[1];number=+m[2];if(date!==selected){alert("Le raccourci contient des pas pour "+date+" alors que le jour affiché est "+selected);return}}else {number=Number(text.replace(/\s/g,"").replace(/pas/gi,""));if(!Number.isFinite(number))number=NaN}if(!Number.isInteger(number)||number<0||number>150000){toast("Valeur de pas invalide");return}dday().steps=number;dday().stepsAt=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});persist();render();toast("Total de pas mis à jour")}
function syncDraftInputs(){if(view==="recipeEdit"&&ui.recipeDraft){ui.recipeDraft.name=$("#recipe-name")?.value||"";ui.recipeDraft.finalGrams=+($("#final-grams")?.value||0);ui.recipeDraft.servings=+($("#servings")?.value||1);document.querySelectorAll("[data-recipe-qty]").forEach(el=>ui.recipeDraft.ingredients[+el.dataset.recipeQty].qty=+el.value)}if(view==="session"&&ui.session){ui.session.name=$("#session-name")?.value||"";ui.session.rating=$("#session-rating")?.value||"Stable";document.querySelectorAll("[data-exercise-name]").forEach(el=>ui.session.exercises[+el.dataset.exerciseName].name=el.value);document.querySelectorAll("[data-set-kg],[data-set-reps]").forEach(el=>{let attr=el.dataset.setKg!==undefined?"setKg":"setReps",[i,j]=el.dataset[attr].split(":").map(Number);ui.session.exercises[i].sets[j][attr==="setKg"?"kg":"reps"]=+el.value})}}
// Tous les boutons utilisent la délégation d'événements : compatible avec les écrans reconstruits.
document.addEventListener("click",async e=>{let el=e.target.closest("[data-action]");if(!el)return;let a=el.dataset.action,idx=Number(el.dataset.index);if(a==="go")return go(el.dataset.to);if(a==="close-modal"){$("#modal").innerHTML="";return}if(a==="weight"||a==="waist")return weightSheet(a);if(a==="go-add"){ui.pending=[];return go("add")}if(a==="go-activity")return go("activity");if(a==="go-favs")return go("meals");if(a==="water"){dday().waterMl=Math.max(0,(dday().waterMl||0)+Number(el.dataset.value));persist();render();return}if(a==="import-steps")return importSteps();if(a==="choose-food"){ui.chosen=el.dataset.id;ui.qty=state.recent[ui.chosen]||100;return render()}if(a==="add-selected"){let f=getFood(ui.chosen),qty=+($("#add-qty")?.value||0);if(!f||qty<=0||qty>100000)return alert("Quantité incorrecte");ui.qty=qty;ui.meal=$("#add-meal").value;addList(f,ui.meal);return}if(a==="remove-entry"){dday().foods=dday().foods.filter(f=>f.id!==el.dataset.id);persist();render();return}if(a==="parse-phrase")return parseText();if(a==="commit-phrase")return commitPhrase();if(a==="copy-yesterday"){let prev=state.days[shift(selected,-1)]?.foods||[];if(!prev.length)return toast("Aucun repas hier");if(!confirm("Ajouter les "+prev.length+" aliments d'hier à aujourd'hui ?"))return;dday().foods.push(...prev.map(f=>({...f,id:id()})));persist();render();return}if(a==="save-meal"){let meal=el.dataset.meal,items=dday().foods.filter(x=>x.meal===meal);if(!items.length)return toast("Aucun aliment à mémoriser");let name=prompt("Nom du repas habituel :",meal+" habituel");if(!name?.trim())return;state.mealFavs.push({id:id(),name:name.trim(),items:items.map(x=>({...x}))});persist();render();return}if(a==="use-meal"){let fav=state.mealFavs.find(f=>f.id===el.dataset.id);if(!fav)return;dday().foods.push(...fav.items.map(x=>({...x,id:id()})));persist();render();toast("Repas habituel ajouté");return}if(a==="online-search"||a==="barcode"){let q=a==="barcode"?prompt("Numéro du code-barres (8 à 14 chiffres) :"):($("#food-search")?.value||"").trim();if(!q)return toast("Recherche vide");if(a==="barcode"&&!/^\d{8,14}$/.test(q))return toast("Code-barres invalide");el.disabled=true;el.textContent="Recherche…";try{ui.online=await offSearch(q,a==="barcode");$("#online-results").innerHTML=onlineHTML();toast(ui.online.length?ui.online.length+" produit(s) trouvé(s)":"Aucun produit complet trouvé")}catch(_){toast("Recherche indisponible (connexion ou autorisation)")}finally{el.disabled=false;el.textContent=a==="barcode"?"Code-barres":"Rechercher en ligne"}return}if(a==="choose-online"){let f=ui.online.find(x=>x.id===el.dataset.id);if(!f)return;let existing=state.customFoods.find(x=>x.id===f.id);if(!existing){state.customFoods.push(f);persist()}ui.chosen=f.id;ui.qty=state.recent[f.id]||100;return render()}if(a==="new-recipe")return createRecipe();if(a==="recipe-detail"){ui.recipeId=el.dataset.id;return go("recipe")}if(a==="edit-recipe")return createRecipe(state.recipes.find(x=>x.id===el.dataset.id));if(a==="ingredient"){syncDraftInputs();ui.recipeDraft.ingredients.push({foodId:el.dataset.id,qty:100});ui.recipeSearch="";return render()}if(a==="remove-ingredient"){syncDraftInputs();ui.recipeDraft.ingredients.splice(idx,1);return render()}if(a==="save-recipe"){syncDraftInputs();let r=ui.recipeDraft;if(!r.name.trim()||!r.ingredients.length||r.finalGrams<=0||r.servings<=0||r.ingredients.some(x=>x.qty<=0))return alert("Renseigne le nom, les ingrédients, leurs quantités et le poids final.");if(r.id){state.recipes=state.recipes.map(x=>x.id===r.id?r:x)}else{r.id=id();state.recipes.push(r)}persist();ui.recipeId=r.id;return go("recipe")}if(a==="add-recipe"){let r=state.recipes.find(x=>x.id===el.dataset.id),qty=+($("#recipe-qty")?.value||0);if(!r||qty<=0)return toast("Poids invalide");let f={id:"rec"+r.id,name:r.name,...recipePer100(r),source:"Recette personnelle"};dday().foods.push(entry(f,qty,$("#recipe-meal").value));persist();go("meals");toast("Recette ajoutée");return}if(a==="new-session")return makeSession();if(a==="add-exercise"){syncDraftInputs();ui.session.exercises.push({name:"Nouvel exercice",sets:[{kg:0,reps:8}]});return render()}if(a==="remove-exercise"){syncDraftInputs();ui.session.exercises.splice(idx,1);return render()}if(a==="add-set"){syncDraftInputs();ui.session.exercises[idx].sets.push({kg:0,reps:8});return render()}if(a==="remove-set"){syncDraftInputs();ui.session.exercises[idx].sets.pop();return render()}if(a==="save-session"){syncDraftInputs();if(!ui.session.name.trim())return toast("Donne un nom à ta séance");dday().workouts||=[];dday().workouts.push({...ui.session,id:id()});persist();go("activity");return}if(a==="delete-workout"){if(!confirm("Supprimer cette séance ?"))return;dday().workouts=dday().workouts.filter(w=>w.id!==el.dataset.id);persist();return render()}if(a==="save-activity"){dday().burned=Math.max(0,+$("#burned-input").value||0);dday().cardio=Math.max(0,+$("#cardio-input").value||0);persist();render();return toast("Activité enregistrée")}if(a==="save-recovery"){Object.assign(dday(),{sleep:+$("#sleep-input").value||0,fatigue:+$("#fatigue-input").value,soreness:+$("#soreness-input").value});persist();render();return toast("Récupération enregistrée")}if(a==="save-goals"){let g={};document.querySelectorAll("[data-goal]").forEach(x=>g[x.dataset.goal]=+x.value);if(Object.values(g).some(x=>!Number.isFinite(x)||x<=0))return alert("Objectifs invalides");state.goals=g;persist();return go("settings")}if(a==="export")return sendBackup();if(a==="import")return $("#import-file").click();if(a==="new-custom")return sheet("Aliment personnalisé",`<div class="field"><label>Nom</label><input id="custom-name" required></div>${[["kcal","Calories"],["protein","Protéines (g)"],["carbs","Glucides (g)"],["fat","Lipides (g)"]].map(([key,label])=>`<div class="field"><label>${label} pour 100 g</label><input id="custom-${key}" type="number" min="0" step=".1" required></div>`).join("")}`,"custom")});
document.addEventListener("input",e=>{if(e.target.id==="food-search"){ui.search=e.target.value;$("#search-results").innerHTML=searchHTML()}if(e.target.id==="recipe-search"){ui.recipeSearch=e.target.value;$("#recipe-results").innerHTML=recipeResults()}if(e.target.id==="add-qty"){ui.qty=+e.target.value||0;let f=getFood(ui.chosen),p=f?macros(f,ui.qty):null,box=$("#add-preview");if(box&&p)box.innerHTML=`<b>${fmt(p.kcal)} kcal</b><small style="display:block">P ${p.protein} g · G ${p.carbs} g · L ${p.fat} g</small>`;}if(e.target.dataset.pendingQty!==undefined){let p=ui.pending[+e.target.dataset.pendingQty];p.qty=+e.target.value||0;/* Résultat mis à jour à la validation */}});
document.addEventListener("change",e=>{if(e.target.id==="global-date"&&e.target.value){selected=e.target.value;render();return;}if(e.target.id==="add-meal")ui.meal=e.target.value;if(e.target.dataset.pendingChoice!==undefined)ui.pending[+e.target.dataset.pendingChoice].choice=e.target.value;if(e.target.id==="day-complete"){dday().complete=e.target.checked;persist()}});
document.addEventListener("submit",e=>{if(e.target.id!=="modal-form")return;e.preventDefault();let kind=e.target.dataset.kind;let number=+$("#modal-number")?.value;if(kind==="weight"||kind==="waist"){if(!Number.isFinite(number)||number<=0)return;dday()[kind]=dec(number)}else if(kind==="custom"){let name=$("#custom-name").value.trim();if(!name)return;let food={id:"user"+id(),name,category:"Personnel",source:"Saisie personnelle",aliases:[]};for(let k of ["kcal","protein","carbs","fat"]){food[k]=+$("#custom-"+k).value;if(!Number.isFinite(food[k])||food[k]<0)return}state.customFoods.push(food);ui.chosen=food.id;ui.qty=100;view="add"}persist();$("#modal").innerHTML="";render();toast("Enregistré")});
document.addEventListener("change",e=>{if(e.target.id!=="import-file")return;let file=e.target.files?.[0];if(!file)return;file.text().then(txt=>{let parsed=JSON.parse(txt);if(!parsed.days||!parsed.goals||!Array.isArray(parsed.recipes)||!Array.isArray(parsed.customFoods))throw Error("Format inconnu");if(!confirm("Remplacer toutes les données actuelles par celles du fichier ?"))return;state={...structuredClone(DEFAULT),...parsed};persist();render();toast("Sauvegarde restaurée")}).catch(()=>alert("Fichier invalide"));e.target.value=""});
init();
</script>
</body></html>
