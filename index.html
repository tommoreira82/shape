return `${shapeHeader('Shape',smallDate(selected))}${macroCards()}<div class="section"><div class="card"><div class="between" style="margin-bottom:13px"><h2 style="margin:0">Actions rapides</h2><span class="muted tiny">1 toucher</span></div><div class="quick-actions">${quick.map(q=>`<button class="quick-tile" data-action="${q.a}" ${q.val?`data-value="${q.val}"`:''} ${q.to?`data-to="${q.to}"`:''}>${toneIcon(q.ico,q.c)}<b>${q.label}</b></button>`).join('')}</div></div></div><div class="section">${healthTiles()}</div><div class="section"><div class="card"><div class="between"><div class="card-title" style="margin:0">${toneIcon('chart','violet')}<h2>Mon poids</h2></div><button class="linkbtn" data-action="go" data-to="progress">Voir tout ${icon('arrow')}</button></div><div class="between" style="margin:14px 0 0;align-items:end"><div><div class="big">${listWeight()}</div>${weights!=null?`<small class="${weights<=0?'success':'warning'}">${weights<0?'↓':'↑'} ${Math.abs(weights).toLocaleString('fr-FR')} kg depuis la première mesure</small>`:'<small>Enregistre ta première pesée</small>'}</div><div class="mini-line">${miniGraph(p,'#a58cff',85)}</div></div></div></div><div class="section"><div class="card"><div class="card-title">${toneIcon('sparkles','violet')}<h2>Coach du jour</h2></div><p style="margin:0;color:#dce8fb;font-size:13px">${esc(coach())}</p></div></div>`}
function lastChange(p){if(p.length<2)return null;return dec(p.at(-1).value-p[0].value)}
function addList(f,meal){dday().foods.push(entry(f,ui.qty,meal));state.recent[f.id]=ui.qty;persist();render();toast("Aliment ajouté")}
function mealNames(){return ["Petit-déjeuner","Déjeuner","Collation","Dîner"]}
function listEntries(items){return items.length?items.map(f=>`<div class="entry"><div class="entry-main grow"><span class="meal-bullet">${icon('utensils')}</span><div class="grow"><b>${esc(f.name)}</b><small>${fmt(f.qty)} g · P ${dec(f.protein)} · G ${dec(f.carbs)} · L ${dec(f.fat)}</small></div></div><div class="right"><b>${fmt(f.kcal)} kcal</b><br><button class="linkbtn pink" data-action="remove-entry" data-id="${esc(f.id)}" aria-label="Supprimer ${esc(f.name)}">Retirer</button></div></div>`).join(''):`<p class="note">Aucun aliment pour ce repas.</p>`}
function meals(){let d=dday(),t=total(),g=state.goals;let mealIcons={'Petit-déjeuner':['clock','orange'],'Déjeuner':['utensils','green'],'Collation':['leaf','pink'],'Dîner':['moon','violet']};return `${shapeHeader('Mes repas',smallDate(selected))}<div class="card"><div class="between"><div><small>Consommé aujourd'hui</small><div class="big">${fmt(t.kcal)} <span style="font-size:13px;color:var(--muted);font-weight:500">/ ${fmt(g.kcal)} kcal</span></div></div><button class="btn small" data-action="go-add">${icon('plus')} Ajouter</button></div>${progress(t.kcal,g.kcal,'var(--violet)')}<div class="grid3" style="margin-top:13px">${[['Protéines','protein','var(--green)'],['Glucides','carbs','var(--orange)'],['Lipides','fat','var(--pink)']].map(([n,k,c])=>`<div style="min-width:0"><small>${n}</small><div style="color:${c};font-weight:800;white-space:nowrap;margin:4px 0">${fmt(t[k])} g</div>${progress(t[k],g[k],c)}</div>`).join('')}</div></div><div class="row wrap" style="margin:14px 0"><button class="btn secondary small" data-action="go" data-to="recipes">${icon('book')} Recettes</button><button class="btn secondary small" data-action="copy-yesterday">${icon('copy')} Copier hier</button></div>${mealNames().map(meal=>{let foods=d.foods.filter(x=>x.meal===meal),v=total(foods).kcal,[ico,c]=mealIcons[meal];return `<div class="card"><div class="between"><div class="card-title" style="margin:0">${toneIcon(ico,c)}<div><h3 style="margin:0">${esc(meal)}</h3><small>${fmt(v)} kcal</small></div></div><div><button class="tap" data-action="go-add" aria-label="Ajouter un aliment">${icon('plus')}</button></div></div><div style="margin-top:8px">${listEntries(foods)}</div>${foods.length?`<button class="linkbtn" data-action="save-meal" data-meal="${esc(meal)}">${icon('book')} Enregistrer comme repas favori</button>`:''}</div>`}).join('')}<div class="card"><label class="check"><input type="checkbox" id="day-complete" ${d.complete?'checked':''}><span>J'ai enregistré tous mes repas du jour</span></label><p class="note" style="margin-bottom:0">Cela aide le coach à analyser uniquement les journées complètes.</p></div>${state.mealFavs.length?`<div class="section"><h2>Mes repas favoris</h2>${state.mealFavs.map(f=>`<div class="card between"><div><b>${esc(f.name)}</b><small style="display:block;margin-top:5px">${f.items.length} aliments · ${fmt(total(f.items).kcal)} kcal</small></div><button class="btn small" data-action="use-meal" data-id="${esc(f.id)}">${icon('plus')} Ajouter</button></div>`).join('')}</div>`:''}`}
function addScreen(){let chosen=getFood(ui.chosen),q=ui.qty,mealOpt=mealNames().map(n=>`<option ${ui.meal===n?'selected':''}>${esc(n)}</option>`).join(''),rec=chosen?macros(chosen,q):null;return `${shapeHeader('Ajouter un repas','Saisie rapide, valeurs automatiques')}<div class="card"><div class="card-title">${toneIcon('sparkles','violet')}<h3>Ajout intelligent</h3></div><div class="field"><label>Exemple : 200g riz cuit + 150g poulet + 10g huile</label><textarea id="phrase" placeholder="200g riz cuit + 150g poulet + 10g huile olive"></textarea></div><button class="btn full" data-action="parse-phrase">${icon('sparkles')} Analyser mon repas</button>${ui.pending.length?pendingHTML():''}</div><div class="card"><div class="card-title">${toneIcon('search','blue')}<h3>Rechercher un aliment</h3></div><div class="search-field"><span>${icon('search')}</span><input id="food-search" autocomplete="off" placeholder="Riz, poulet, skyr, banane…" value="${esc(ui.search)}"></div><div id="search-results" style="margin-top:8px">${searchHTML()}</div></div><div class="card"><div class="card-title">${toneIcon('book','orange')}<h3>Produits de marque</h3></div><div class="row wrap"><button class="btn small secondary" data-action="online-search">${icon('search')} Rechercher en ligne</button><button class="btn small secondary" data-action="barcode">Code-barres</button></div><p class="note">Open Food Facts nécessite Internet ; le code-barres peut aussi être saisi manuellement.</p><div id="online-results">${onlineHTML()}</div></div><div class="card"><div class="card-title">${toneIcon('utensils','green')}<h3>Aliment sélectionné</h3></div>${chosen?`<div class="good"><b>${esc(chosen.name)}</b><small style="display:block;margin-top:4px">${esc(chosen.source)} · ${fmt(chosen.kcal)} kcal / 100 g</small></div><div class="grid2" style="margin-top:13px"><div class="field"><label>Quantité (g ou ml)</label><input id="add-qty" type="number" min="1" step="1" value="${q}"></div><div class="field"><label>Repas</label><select id="add-meal">${mealOpt}</select></div></div><div class="card flat" id="add-preview"><b>${fmt(rec.kcal)} kcal</b><small style="display:block;margin-top:4px">P ${rec.protein} g · G ${rec.carbs} g · L ${rec.fat} g</small></div><button class="btn green full" data-action="add-selected">${icon('plus')} Ajouter à ma journée</button>`:`<p class="note">Choisis un aliment dans les résultats pour remplir automatiquement ses valeurs.</p>`}</div>`}
function searchHTML(){return findFoods(ui.search,ui.search?12:7).map(f=>`<div class="searchitem"><div class="grow"><strong>${esc(f.name)}</strong><small>${esc(f.category||'Produit')} · ${fmt(f.kcal)} kcal / 100 g</small></div><button class="tap" data-action="choose-food" data-id="${esc(f.id)}">Choisir ${icon('arrow')}</button></div>`).join('')}
function onlineHTML(){return (ui.online||[]).map(f=>`<div class="searchitem"><div class="grow"><strong>${esc(f.name)}</strong><small>${fmt(f.kcal)} kcal · ${esc(f.brand||'')}</small></div><button class="tap" data-action="choose-online" data-id="${esc(f.id)}">Choisir</button></div>`).join('')}
function pendingHTML(){let ok=ui.pending.every(p=>p.matches.length&&p.choice&&p.qty>0),validItems=ui.pending.filter(p=>p.choice&&p.qty>0);return `<div class="divider"></div><h3>Vérifie les aliments reconnus</h3>${ui.pending.map((p,i)=>`<div class="field"><label>${esc(p.input)} — quantité (g)</label><div class="grid2"><input type="number" min="1" data-pending-qty="${i}" value="${p.qty}"><select data-pending-choice="${i}">${p.matches.length?p.matches.map(f=>`<option value="${esc(f.id)}" ${p.choice===f.id?'selected':''}>${esc(f.name)}</option>`).join(''):'<option value="">Non reconnu</option>'}</select></div></div>`).join('')}<div class="field"><label>Ajouter dans</label><select id="phrase-meal">${mealNames().map(x=>`<option ${ui.meal===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="card flat"><b id="phrase-total">${fmt(total(validItems.map(p=>macros(getFood(p.choice),p.qty))).kcal)} kcal</b><small style="display:block">Total estimé du repas</small></div><button class="btn green full" data-action="commit-phrase" ${ok?'':'disabled'}>${icon('check')} Confirmer et ajouter</button>`}
function recipes(){return `${shapeHeader('Mes recettes','Tes préparations maison, à retrouver en un toucher')}<button class="btn full" data-action="new-recipe">${icon('plus')} Nouvelle recette</button>${state.recipes.length?state.recipes.map(r=>`<button class="card-link" data-action="recipe-detail" data-id="${esc(r.id)}">${toneIcon('book','orange')}<div class="link-title"><b>${esc(r.name)}</b><small>${fmt(recipePer100(r).kcal)} kcal / 100 g · ${r.ingredients.length} ingrédients</small></div>${icon('arrow')}</button>`).join(''):`<div class="card"><p class="note">Aucune recette enregistrée. Crée ta recette une seule fois puis ajoute-la avec son poids cuit.</p></div>`}`}
function recipePer100(r){let ingredients=r.ingredients.map(it=>macros(getFood(it.foodId)||it,it.qty));let all=total(ingredients),ratio=100/(Number(r.finalGrams)||1);return Object.fromEntries(Object.entries(all).map(([k,v])=>[k,dec(v*ratio)]))}
function recipeScreen(){let r=state.recipes.find(x=>x.id===ui.recipeId);if(!r)return recipes();let p=recipePer100(r);return `${shapeHeader(r.name,'Recette maison')}<div class="grid2">${[['Calories',p.kcal,'kcal','violet'],['Protéines',p.protein,'g','green'],['Glucides',p.carbs,'g','orange'],['Lipides',p.fat,'g','pink']].map(([a,b,c,t])=>`<div class="stat" style="min-height:94px"><small>${a} / 100 g</small><strong style="color:var(--${t})">${b} ${c}</strong></div>`).join('')}</div><div class="card"><h3>Ajouter une portion</h3><p class="note">Poids final : ${fmt(r.finalGrams)} g · ${fmt(r.servings||1)} portions prévues.</p><div class="field"><label>Poids de ta portion (g)</label><input id="recipe-qty" type="number" min="1" value="${Math.round(r.finalGrams/(r.servings||1))}"></div><div class="field"><label>Repas</label><select id="recipe-meal">${mealNames().map(m=>`<option ${ui.meal===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div><button class="btn green full" data-action="add-recipe" data-id="${esc(r.id)}">${icon('plus')} Ajouter cette portion</button></div><div class="card"><h3>Ingrédients</h3>${r.ingredients.map(it=>{let f=getFood(it.foodId)||it;return `<div class="entry"><b>${esc(f.name||'Aliment')}</b><small>${fmt(it.qty)} g</small></div>`}).join('')}</div><div class="row wrap" style="margin-top:13px"><button class="btn secondary" data-action="edit-recipe" data-id="${esc(r.id)}">${icon('edit')} Modifier</button><button class="btn secondary" data-action="delete-recipe" data-id="${esc(r.id)}" style="color:var(--pink)">${icon('trash')} Supprimer</button></div>`}
function recipeEditor(){let r=ui.recipeDraft;return `${shapeHeader(r.id?'Modifier la recette':'Nouvelle recette','Enregistre-la une fois, réutilise-la à volonté')}<div class="card"><div class="field"><label>Nom de la recette</label><input id="recipe-name" value="${esc(r.name)}" placeholder="Bolognaise maison"></div><div class="field"><label>Ajouter un ingrédient</label><div class="search-field"><span>${icon('search')}</span><input id="recipe-search" value="${esc(ui.recipeSearch)}" placeholder="Pâtes crues, viande, tomate…"></div></div><div id="recipe-results">${recipeResults()}</div></div><div class="card"><h3>Ingrédients (${r.ingredients.length})</h3>${r.ingredients.map((it,i)=>{let f=getFood(it.foodId)||it;return `<div class="entry"><div class="grow"><b>${esc(f.name||'Aliment')}</b><div class="field" style="margin:7px 0 0"><input type="number" min="1" value="${it.qty}" data-recipe-qty="${i}" aria-label="Grammes de ${esc(f.name||'ingrédient')}"></div></div><button class="tap" data-action="remove-ingredient" data-index="${i}" aria-label="Retirer ingrédient" style="color:var(--pink)">${icon('trash')}</button></div>`}).join('')||'<p class="note">Ajoute un ingrédient ci-dessus.</p>'}<div class="grid2" style="margin-top:14px"><div class="field"><label>Poids final cuit (g)</label><input id="final-grams" type="number" min="1" value="${r.finalGrams||''}"></div><div class="field"><label>Nombre de portions</label><input id="servings" type="number" min="1" value="${r.servings||1}"></div></div><p class="note">Le poids final après cuisson permet de calculer les macros par portion.</p><button class="btn green full" data-action="save-recipe">${icon('check')} Enregistrer la recette</button></div>`}
function recipeResults(){return ui.recipeSearch?findFoods(ui.recipeSearch,7).map(f=>`<div class="searchitem"><div class="grow"><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal / 100 g</small></div><button class="tap" data-action="ingredient" data-id="${esc(f.id)}">${icon('plus')}</button></div>`).join(''):''}
function activity(){let d=dday();let last=Object.entries(state.days).filter(([date,x])=>date<=selected&&x.workouts?.length).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,4);return `${shapeHeader('Activité','Musculation, cardio et récupération')}<div class="grid2"><button class="card-link" style="margin:0" data-action="new-session">${toneIcon('dumbbell','green')}<div class="link-title"><b>Nouvelle séance</b><small>Charges et répétitions</small></div></button><button class="card-link" style="margin:0" data-action="go" data-to="recovery">${toneIcon('moon','violet')}<div class="link-title"><b>Récupération</b><small>Sommeil et fatigue</small></div></button></div><div class="section"><h2>Objectifs du jour</h2><div class="grid2"><div class="stat"><small>Mes pas</small><strong style="color:var(--green)">${fmt(d.steps||0)}</strong>${progress(d.steps,state.goals.steps,'var(--green)')}</div><div class="stat"><small>Calories actives estimées</small><strong style="color:var(--pink)">${fmt(d.burned||0)} kcal</strong>${progress(d.burned,state.goals.burned,'var(--pink)')}</div></div></div><div class="card"><div class="card-title">${toneIcon('flame','orange')}<h3>Cardio & dépense</h3></div><div class="grid2"><div class="field"><label>Calories actives estimées (kcal)</label><input id="burned-input" type="number" min="0" value="${d.burned??''}"></div><div class="field"><label>Cardio (minutes)</label><input id="cardio-input" type="number" min="0" value="${d.cardio??''}"></div></div><button class="btn secondary full" data-action="save-activity">Enregistrer l'activité</button><p class="note" style="margin-bottom:0">La dépense est indicative et ne s'ajoute pas automatiquement à ton budget calorique.</p></div><div class="section"><h2>Mes dernières séances</h2>${last.length?last.flatMap(([date,x])=>x.workouts.map(w=>`<div class="card"><div class="between"><div><b>${esc(w.name)}</b><small style="display:block;margin-top:5px">${date.split('-').reverse().join('/')} · ${w.exercises.length} exercices · ${esc(w.rating||'—')}</small></div>${date===selected?`<button class="linkbtn pink" data-action="delete-workout" data-id="${esc(w.id)}">Retirer</button>`:''}</div>${w.exercises.map(e=>`<small style="display:block;margin-top:9px">${esc(e.name)} : ${e.sets.map(s=>fmt(s.kg)+' kg × '+fmt(s.reps)).join(' · ')}</small>`).join('')}</div>`)).join(''):`<div class="card note">Aucune séance enregistrée. Utilise « Nouvelle séance » pour commencer.</div>`}</div>`}
function sessionEditor(){let w=ui.session;return `${shapeHeader('Nouvelle séance','Renseigne seulement les séries utiles')}<div class="card"><div class="field"><label>Nom de la séance</label><input id="session-name" value="${esc(w.name)}" placeholder="Haut du corps"></div><div class="field"><label>Ressenti de la séance</label><select id="session-rating">${['Excellente','Bonne','Stable','En baisse'].map(x=>`<option ${w.rating===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${w.exercises.map((e,i)=>`<div class="card"><div class="between"><h3 style="margin:0">${esc(e.name)}</h3><button class="linkbtn pink" data-action="remove-exercise" data-index="${i}">Retirer</button></div><div class="field" style="margin-top:12px"><label>Exercice</label><input data-exercise-name="${i}" value="${esc(e.name)}"></div>${e.sets.map((s,j)=>`<div class="grid2" style="margin-bottom:8px"><div><label>Poids (kg)</label><input type="number" min="0" step=".5" data-set-kg="${i}:${j}" value="${s.kg}"></div><div><label>Répétitions</label><input type="number" min="1" data-set-reps="${i}:${j}" value="${s.reps}"></div></div>`).join('')}<div class="row wrap"><button class="btn small secondary" data-action="add-set" data-index="${i}">${icon('plus')} Série</button><button class="linkbtn pink" data-action="remove-set" data-index="${i}">− Dernière série</button></div></div>`).join('')}<div class="card"><div class="row wrap"><button class="btn secondary" data-action="add-exercise">${icon('plus')} Exercice</button><button class="btn green" data-action="save-session">${icon('check')} Terminer la séance</button></div></div>`}
function recovery(){let d=dday();return `${shapeHeader('Récupération',smallDate(selected))}<div class="card"><div class="card-title">${toneIcon('moon','violet')}<h3>Sommeil & forme</h3></div><div class="field"><label>Durée du sommeil (heures)</label><input id="sleep-input" type="number" min="0" max="24" step=".25" value="${d.sleep??''}" placeholder="Ex. 7,5"></div><div class="field"><label>Fatigue ressentie</label><select id="fatigue-input">${[1,2,3,4,5].map(i=>`<option value="${i}" ${d.fatigue==i?'selected':''}>${i} / 5 — ${['Très faible','Faible','Moyenne','Élevée','Très élevée'][i-1]}</option>`).join('')}</select></div><div class="field"><label>Courbatures</label><select id="soreness-input">${[1,2,3,4,5].map(i=>`<option value="${i}" ${d.soreness==i?'selected':''}>${i} / 5 — ${['Aucune','Légères','Moyennes','Fortes','Très fortes'][i-1]}</option>`).join('')}</select></div><button class="btn full" data-action="save-recovery">${icon('check')} Enregistrer ma récupération</button></div><div class="card"><div class="card-title">${toneIcon('sparkles','violet')}<h3>Analyse de la récupération</h3></div><p class="note" style="margin:0">${d.sleep!==undefined||d.fatigue!==undefined?((Number(d.sleep)<7||Number(d.fatigue)>=4)?'Ta récupération semble limitée. Surveille ton sommeil et adapte l’intensité des séances si nécessaire.':'Tes derniers indicateurs ne signalent pas de fatigue marquée. Observe surtout la tendance sur plusieurs jours.'):'Renseigne ton sommeil et ta fatigue pour obtenir un premier bilan.'}</p></div>`}
function progressScreen(){let d=dday(),p=trendValues(),last=p.slice(-7),avg=last.length?last.reduce((a,b)=>a+b.value,0)/last.length:null;let prev=p.slice(-14,-7),avgPrev=prev.length?prev.reduce((a,b)=>a+b.value,0)/prev.length:null,delta=avg!==null&&avgPrev!==null?dec(avg-avgPrev):null;return `${shapeHeader('Évolution','Ta progression sur la durée')}<div class="card"><div class="between"><div><small>Poids actuel</small><div class="big">${listWeight()}</div></div><button class="btn small" data-action="weight">${icon('plus')} Pesée</button></div><div class="divider"></div>${miniGraph(p,'#a58cff',170)}<div class="grid2"><div class="stat"><small>Moyenne 7 dernières pesées</small><strong>${avg!==null?dec(avg).toLocaleString('fr-FR')+' kg':'—'}</strong></div><div class="stat"><small>Évolution des moyennes</small><strong class="${delta!==null&&delta<0?'success':''}">${delta===null?'—':(delta>0?'+':'')+delta.toLocaleString('fr-FR')+' kg'}</strong></div></div></div><div class="card"><div class="between"><div class="card-title" style="margin:0">${toneIcon('target','blue')}<h3>Tour de taille</h3></div><button class="btn small secondary" data-action="waist">${icon('plus')} Mesure</button></div><div class="big" style="margin-top:12px">${d.waist?d.waist+' cm':'—'}</div></div><div class="card"><div class="card-title">${toneIcon('sparkles','violet')}<h3>Coach Shape</h3></div><p class="note" style="margin:0">${esc(coach())}</p></div><div class="card"><h3>Historique des pesées</h3>${p.slice(-20).reverse().map(x=>`<div class="entry"><b>${x.date.split('-').reverse().join('/')}</b><span>${x.value.toLocaleString('fr-FR')} kg</span></div>`).join('')||'<p class="note">Aucune pesée enregistrée.</p>'}</div>`}
function settings(){let links=[{ico:'target',tone:'violet',title:'Mes objectifs',desc:'Calories, macros, pas, eau, sommeil',page:'goals'},{ico:'book',tone:'orange',title:'Mes recettes',desc:'Retrouver et gérer tes préparations',page:'recipes'},{ico:'moon',tone:'blue',title:'Récupération',desc:'Sommeil, fatigue, courbatures',page:'recovery'},{ico:'chart',tone:'green',title:'Mon évolution',desc:'Poids et tendances',page:'progress'}];return `${shapeHeader('Plus','Réglages et données personnelles')}<div class="card"><h3>Personnalisation</h3>${links.map(x=>`<button class="card-link" data-action="go" data-to="${x.page}">${toneIcon(x.ico,x.tone)}<div class="link-title"><b>${x.title}</b><small>${x.desc}</small></div>${icon('arrow')}</button>`).join('')}</div><div class="card"><div class="card-title">${toneIcon('save','green')}<h3>Sauvegarde des données</h3></div><div class="row wrap"><button class="btn secondary small" data-action="export">${icon('save')} Exporter JSON</button><button class="btn secondary small" data-action="import">Importer JSON</button></div><input id="import-file" type="file" accept=".json,application/json" hidden><p class="note">Données enregistrées sur cet appareil, sans cloud. Exporte une sauvegarde avant chaque mise à jour Weejur et conserve-la dans Fichiers.</p></div><div class="card"><div class="card-title">${toneIcon('heart','pink')}<h3>Apple Santé</h3></div><p class="note">Cette application web ne lit pas directement les pas de Santé. Utilise un raccourci iOS pour copier le total, puis colle-le ici.</p><button class="btn secondary full" data-action="import-steps">${icon('footsteps')} Importer mes pas</button></div><div class="card"><div class="card-title">${toneIcon('utensils','orange')}<h3>Alimentation</h3></div><p class="note">Base locale indicative et produits de marque Open Food Facts. Vérifie les étiquettes et l'état cru/cuit des aliments.</p><button class="btn secondary full" data-action="new-custom">${icon('plus')} Ajouter un aliment personnel</button></div>`}
function goals(){let g=state.goals;let items=[['kcal','Calories / jour','kcal'],['protein','Protéines (g)','g'],['carbs','Glucides (g)','g'],['fat','Lipides (g)','g'],['steps','Pas quotidiens','pas'],['water','Eau (ml)','ml'],['sleep','Sommeil (h)','h'],['burned','Calories actives indicatives','kcal'],['loss','Perte visée (kg/semaine)','kg']];return `${shapeHeader('Mes objectifs','Personnalisables à tout moment')}<div class="card"><div class="card-title">${toneIcon('target','violet')}<h3>Objectifs personnels</h3></div><div class="grid2">${items.map(([key,label,u])=>`<div class="field"><label>${label}</label><input type="number" min="0" step="${key==='loss'?'0.05':key==='sleep'?'0.25':'1'}" data-goal="${key}" value="${g[key]}"></div>`).join('')}</div><button class="btn full" data-action="save-goals">${icon('check')} Enregistrer les objectifs</button><p class="note">Les calories actives sont indiquées séparément et ne changent pas le budget alimentaire.</p></div>`}
function navbar(){let current={home:'home',meals:'meals',add:'meals',recipes:'meals',recipe:'meals',recipeEdit:'meals',activity:'activity',session:'activity',recovery:'activity',progress:'progress',settings:'settings',goals:'settings'}[view];document.querySelector('#nav').innerHTML=`<div>${[['home','home','Accueil'],['meals','utensils','Repas'],['activity','dumbbell','Activité'],['progress','chart','Évolution'],['settings','more','Plus']].map(([page,ico,label])=>`<button class="${page===current?'on':''}" data-action="go" data-to="${page}" ${page===current?'aria-current="page"':''}>${icon(ico)}${label}</button>`).join('')}</div>`}
function render(){let renderers={home,meals,add:addScreen,recipes,recipe:recipeScreen,recipeEdit:recipeEditor,activity,session:sessionEditor,recovery,progress:progressScreen,settings,goals};$("#app").innerHTML=(renderers[view]||home)();navbar()}
function go(page){view=page;ui.online=[];render();scrollTo({top:0,behavior:"smooth"})}
function toast(message){let n=document.createElement("div");n.textContent=message;n.style.cssText="position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#2e3c52;color:white;padding:12px 16px;border-radius:12px;z-index:30;max-width:90%";document.body.append(n);setTimeout(()=>n.remove(),2300)}
function sheet(title,body,kind){$("#modal").innerHTML=`<div class="overlay"><div class="sheet"><div class="between"><h2>${esc(title)}</h2><button class="tap" data-action="close-modal">✕</button></div><form id="modal-form" data-kind="${kind}">${body}<button class="btn full" type="submit">Enregistrer</button></form></div></div>`}
function weightSheet(kind="weight"){let d=dday(),past=trendValues().at(-1)?.value||70;sheet(kind==="weight"?"Pesée du matin":"Tour de taille",`<div class="field"><label>${kind==="weight"?"Poids (kg)":"Tour de taille (cm)"}</label><input id="modal-number" type="number" required autofocus min="${kind==="weight"?20:30}" max="${kind==="weight"?300:250}" step=".1" value="${kind==="weight"?(d.weight||past):(d.waist||"")}"></div>`,kind)}
function parseText(){let chunks=$("#phrase").value.replace(/(\d),(?=\d)/g,"$1.").split(/\s*(?:\+|;|\n|,)\s*/).map(x=>x.trim()).filter(Boolean);ui.pending=chunks.map(input=>{let m=input.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l)?\s+(.*)$/i);if(!m)return {input,qty:0,matches:[],choice:null};let qty=Number(m[1].replace(",","."))*(m[2]?.toLowerCase()==="kg"||m[2]?.toLowerCase()==="l"?1000:1);let matches=matchPhrase(m[3]);return {input,qty,matches,choice:matches[0]?.id||null}});$("#app").innerHTML=addScreen();navbar()}
function commitPhrase(){if(ui.pending.some(p=>!p.choice||p.qty<=0)){toast("Vérifie les aliments non reconnus");return}let meal=$("#phrase-meal").value;for(let p of ui.pending){let f=getFood(p.choice);if(!f)return;dday().foods.push(entry(f,p.qty,meal));state.recent[f.id]=p.qty}ui.pending=[];persist();go("meals");toast("Repas ajouté")}
function createRecipe(existing=null){ui.recipeDraft=existing?structuredClone(existing):{id:null,name:"",ingredients:[],finalGrams:0,servings:4};ui.recipeSearch="";go("recipeEdit")}
function makeSession(){ui.session={name:"Haut du corps",rating:"Stable",exercises:[{name:"Développé couché",sets:[{kg:80,reps:8}]}]};go("session")}
function sendBackup(){let a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.href=url;a.download="shape-sauvegarde-"+dayKey()+".json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function offSearch(query,barcode=false){let url;if(barcode)url="https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(query)+".json?fields=code,product_name,product_name_fr,brands,nutriments";else url="https://world.openfoodfacts.org/cgi/search.pl?"+new URLSearchParams({search_terms:query,search_simple:"1",action:"process",json:"1",page_size:"15",fields:"code,product_name,product_name_fr,brands,nutriments"});let r=await fetch(url);if(!r.ok)throw Error("Serveur indisponible");let j=await r.json(),products=barcode?(j.status===1?[j.product]:[]):(j.products||[]);let items=products.map(p=>{let n=p?.nutriments||{},k=n["energy-kcal_100g"]!=null?+n["energy-kcal_100g"]:(n["energy_100g"]!=null?+n["energy_100g"]/4.184:NaN),protein=+n.proteins_100g,carbs=+n.carbohydrates_100g,fat=+n.fat_100g;if([k,protein,carbs,fat].some(x=>!Number.isFinite(x)||x<0)||n.proteins_100g==null||n.carbohydrates_100g==null||n.fat_100g==null)return null;return {id:"off"+(p.code||id()),name:p.product_name_fr||p.product_name||"Produit",brand:p.brands||"",source:"Open Food Facts",category:"Marque",aliases:[],kcal:dec(k),protein:dec(protein),carbs:dec(carbs),fat:dec(fat)}}).filter(Boolean);return items}
async function importSteps(){let text="";try{if(navigator.clipboard?.readText)text=await navigator.clipboard.readText()}catch(e){}if(!text)text=prompt("Colle le total de pas depuis Santé (ex : 8240 ou PAS|2026-10-24|8240) :")||"";let m=text.trim().match(/^PAS\|(\d{4}-\d{2}-\d{2})\|(\d{1,7})$/i);let number,date;if(m){date=m[1];number=+m[2];if(date!==selected){alert("Le raccourci contient des pas pour "+date+" alors que le jour affiché est "+selected);return}}else {number=Number(text.replace(/\s/g,"").replace(/pas/gi,""));if(!Number.isFinite(number))number=NaN}if(!Number.isInteger(number)||number<0||number>150000){toast("Valeur de pas invalide");return}dday().steps=number;dday().stepsAt=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});persist();render();toast("Total de pas mis à jour")}
function syncDraftInputs(){if(view==="recipeEdit"&&ui.recipeDraft){ui.recipeDraft.name=$("#recipe-name")?.value||"";ui.recipeDraft.finalGrams=+($("#final-grams")?.value||0);ui.recipeDraft.servings=+($("#servings")?.value||1);document.querySelectorAll("[data-recipe-qty]").forEach(el=>ui.recipeDraft.ingredients[+el.dataset.recipeQty].qty=+el.value)}if(view==="session"&&ui.session){ui.session.name=$("#session-name")?.value||"";ui.session.rating=$("#session-rating")?.value||"Stable";document.querySelectorAll("[data-exercise-name]").forEach(el=>ui.session.exercises[+el.dataset.exerciseName].name=el.value);document.querySelectorAll("[data-set-kg],[data-set-reps]").forEach(el=>{let attr=el.dataset.setKg!==undefined?"setKg":"setReps",[i,j]=el.dataset[attr].split(":").map(Number);ui.session.exercises[i].sets[j][attr==="setKg"?"kg":"reps"]=+el.value})}}
// Tous les boutons utilisent la délégation d'événements : compatible avec les écrans reconstruits.
document.addEventListener("click",async e=>{let el=e.target.closest("[data-action]");if(!el)return;let a=el.dataset.action,idx=Number(el.dataset.index);if(a==="go")return go(el.dataset.to);if(a==="delete-recipe"){if(!confirm("Supprimer cette recette de ta liste ? Les repas déjà enregistrés seront conservés."))return;state.recipes=state.recipes.filter(r=>r.id!==el.dataset.id);persist();go("recipes");return;}if(a==="close-modal"){$("#modal").innerHTML="";return}if(a==="weight"||a==="waist")return weightSheet(a);if(a==="go-add"){ui.pending=[];return go("add")}if(a==="go-activity")return go("activity");if(a==="go-favs")return go("meals");if(a==="water"){dday().waterMl=Math.max(0,(dday().waterMl||0)+Number(el.dataset.value));persist();render();return}if(a==="import-steps")return importSteps();if(a==="choose-food"){ui.chosen=el.dataset.id;ui.qty=state.recent[ui.chosen]||100;return render()}if(a==="add-selected"){let f=getFood(ui.chosen),qty=+($("#add-qty")?.value||0);if(!f||qty<=0||qty>100000)return alert("Quantité incorrecte");ui.qty=qty;ui.meal=$("#add-meal").value;addList(f,ui.meal);return}if(a==="remove-entry"){dday().foods=dday().foods.filter(f=>f.id!==el.dataset.id);persist();render();return}if(a==="parse-phrase")return parseText();if(a==="commit-phrase")return commitPhrase();if(a==="copy-yesterday"){let prev=state.days[shift(selected,-1)]?.foods||[];if(!prev.length)return toast("Aucun repas hier");if(!confirm("Ajouter les "+prev.length+" aliments d'hier à aujourd'hui ?"))return;dday().foods.push(...prev.map(f=>({...f,id:id()})));persist();render();return}if(a==="save-meal"){let meal=el.dataset.meal,items=dday().foods.filter(x=>x.meal===meal);if(!items.length)return toast("Aucun aliment à mémoriser");let name=prompt("Nom du repas habituel :",meal+" habituel");if(!name?.trim())return;state.mealFavs.push({id:id(),name:name.trim(),items:items.map(x=>({...x}))});persist();render();return}if(a==="use-meal"){let fav=state.mealFavs.find(f=>f.id===el.dataset.id);if(!fav)return;dday().foods.push(...fav.items.map(x=>({...x,id:id()})));persist();render();toast("Repas habituel ajouté");return}if(a==="online-search"||a==="barcode"){let q=a==="barcode"?prompt("Numéro du code-barres (8 à 14 chiffres) :"):($("#food-search")?.value||"").trim();if(!q)return toast("Recherche vide");if(a==="barcode"&&!/^\d{8,14}$/.test(q))return toast("Code-barres invalide");el.disabled=true;el.textContent="Recherche…";try{ui.online=await offSearch(q,a==="barcode");$("#online-results").innerHTML=onlineHTML();toast(ui.online.length?ui.online.length+" produit(s) trouvé(s)":"Aucun produit complet trouvé")}catch(_){toast("Recherche indisponible (connexion ou autorisation)")}finally{el.disabled=false;el.textContent=a==="barcode"?"Code-barres":"Rechercher en ligne"}return}if(a==="choose-online"){let f=ui.online.find(x=>x.id===el.dataset.id);if(!f)return;let existing=state.customFoods.find(x=>x.id===f.id);if(!existing){state.customFoods.push(f);persist()}ui.chosen=f.id;ui.qty=state.recent[f.id]||100;return render()}if(a==="new-recipe")return createRecipe();if(a==="recipe-detail"){ui.recipeId=el.dataset.id;return go("recipe")}if(a==="edit-recipe")return createRecipe(state.recipes.find(x=>x.id===el.dataset.id));if(a==="ingredient"){syncDraftInputs();ui.recipeDraft.ingredients.push({foodId:el.dataset.id,qty:100});ui.recipeSearch="";return render()}if(a==="remove-ingredient"){syncDraftInputs();ui.recipeDraft.ingredients.splice(idx,1);return render()}if(a==="save-recipe"){syncDraftInputs();let r=ui.recipeDraft;if(!r.name.trim()||!r.ingredients.length||r.finalGrams<=0||r.servings<=0||r.ingredients.some(x=>x.qty<=0))return alert("Renseigne le nom, les ingrédients, leurs quantités et le poids final.");if(r.id){state.recipes=state.recipes.map(x=>x.id===r.id?r:x)}else{r.id=id();state.recipes.push(r)}persist();ui.recipeId=r.id;return go("recipe")}if(a==="add-recipe"){let r=state.recipes.find(x=>x.id===el.dataset.id),qty=+($("#recipe-qty")?.value||0);if(!r||qty<=0)return toast("Poids invalide");let f={id:"rec"+r.id,name:r.name,...recipePer100(r),source:"Recette personnelle"};dday().foods.push(entry(f,qty,$("#recipe-meal").value));persist();go("meals");toast("Recette ajoutée");return}if(a==="new-session")return makeSession();if(a==="add-exercise"){syncDraftInputs();ui.session.exercises.push({name:"Nouvel exercice",sets:[{kg:0,reps:8}]});return render()}if(a==="remove-exercise"){syncDraftInputs();ui.session.exercises.splice(idx,1);return render()}if(a==="add-set"){syncDraftInputs();ui.session.exercises[idx].sets.push({kg:0,reps:8});return render()}if(a==="remove-set"){syncDraftInputs();ui.session.exercises[idx].sets.pop();return render()}if(a==="save-session"){syncDraftInputs();if(!ui.session.name.trim())return toast("Donne un nom à ta séance");dday().workouts||=[];dday().workouts.push({...ui.session,id:id()});persist();go("activity");return}if(a==="delete-workout"){if(!confirm("Supprimer cette séance ?"))return;dday().workouts=dday().workouts.filter(w=>w.id!==el.dataset.id);persist();return render()}if(a==="save-activity"){dday().burned=Math.max(0,+$("#burned-input").value||0);dday().cardio=Math.max(0,+$("#cardio-input").value||0);persist();render();return toast("Activité enregistrée")}if(a==="save-recovery"){Object.assign(dday(),{sleep:+$("#sleep-input").value||0,fatigue:+$("#fatigue-input").value,soreness:+$("#soreness-input").value});persist();render();return toast("Récupération enregistrée")}if(a==="save-goals"){let g={};document.querySelectorAll("[data-goal]").forEach(x=>g[x.dataset.goal]=+x.value);if(Object.values(g).some(x=>!Number.isFinite(x)||x<=0))return alert("Objectifs invalides");state.goals=g;persist();return go("settings")}if(a==="export")return sendBackup();if(a==="import")return $("#import-file").click();if(a==="new-custom")return sheet("Aliment personnalisé",`<div class="field"><label>Nom</label><input id="custom-name" required></div>${[["kcal","Calories"],["protein","Protéines (g)"],["carbs","Glucides (g)"],["fat","Lipides (g)"]].map(([key,label])=>`<div class="field"><label>${label} pour 100 g</label><input id="custom-${key}" type="number" min="0" step=".1" required></div>`).join("")}`,"custom")});
document.addEventListener("input",e=>{if(e.target.id==="food-search"){ui.search=e.target.value;$("#search-results").innerHTML=searchHTML()}if(e.target.id==="recipe-search"){ui.recipeSearch=e.target.value;$("#recipe-results").innerHTML=recipeResults()}if(e.target.id==="add-qty"){ui.qty=+e.target.value||0;let f=getFood(ui.chosen),p=f?macros(f,ui.qty):null,box=$("#add-preview");if(box&&p)box.innerHTML=`<b>${fmt(p.kcal)} kcal</b><small style="display:block">P ${p.protein} g · G ${p.carbs} g · L ${p.fat} g</small>`;}if(e.target.dataset.pendingQty!==undefined){let p=ui.pending[+e.target.dataset.pendingQty];p.qty=+e.target.value||0;/* Résultat mis à jour à la validation */}});
document.addEventListener("change",e=>{if(e.target.id==="global-date"&&e.target.value){selected=e.target.value;render();return;}if(e.target.id==="add-meal")ui.meal=e.target.value;if(e.target.dataset.pendingChoice!==undefined)ui.pending[+e.target.dataset.pendingChoice].choice=e.target.value;if(e.target.id==="day-complete"){dday().complete=e.target.checked;persist()}});
document.addEventListener("submit",e=>{if(e.target.id!=="modal-form")return;e.preventDefault();let kind=e.target.dataset.kind;let number=+$("#modal-number")?.value;if(kind==="weight"||kind==="waist"){if(!Number.isFinite(number)||number<=0)return;dday()[kind]=dec(number)}else if(kind==="custom"){let name=$("#custom-name").value.trim();if(!name)return;let food={id:"user"+id(),name,category:"Personnel",source:"Saisie personnelle",aliases:[]};for(let k of ["kcal","protein","carbs","fat"]){food[k]=+$("#custom-"+k).value;if(!Number.isFinite(food[k])||food[k]<0)return}state.customFoods.push(food);ui.chosen=food.id;ui.qty=100;view="add"}persist();$("#modal").innerHTML="";render();toast("Enregistré")});
document.addEventListener("change",e=>{if(e.target.id!=="import-file")return;let file=e.target.files?.[0];if(!file)return;file.text().then(txt=>{let parsed=JSON.parse(txt);if(!parsed.days||!parsed.goals||!Array.isArray(parsed.recipes)||!Array.isArray(parsed.customFoods))throw Error("Format inconnu");if(!confirm("Remplacer toutes les données actuelles par celles du fichier ?"))return;state={...structuredClone(DEFAULT),...parsed};persist();render();toast("Sauvegarde restaurée")}).catch(()=>alert("Fichier invalide"));e.target.value=""});
init();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
